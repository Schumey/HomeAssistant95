    "ha-more-info-info $$ ha-alert $": |
      /* Hinweise (ha-alert) mit eingeritztem Win95-Rahmen und den
         Symbolen aus den Win95-Meldungsfenstern */
      .issue-type {
        padding: 8px 10px !important;
        color: var(--ha95-text);
        box-shadow: inset 1px 1px var(--ha95-shadow), inset -1px -1px var(--ha95-highlight), inset 2px 2px var(--ha95-highlight), inset -2px -2px var(--ha95-shadow);
      }
      .issue-type::after {
        display: none !important;
      }
      .icon {
        width: 32px !important;
        height: 32px !important;
        flex: none;
        background: var(--ha95-icon-info) center / 32px no-repeat;
      }
      .icon ::slotted(*),
      .icon > slot > * {
        visibility: hidden !important;
      }
      .issue-type.warning > .icon {
        background-image: var(--ha95-icon-warning);
      }
      .issue-type.error > .icon {
        background-image: var(--ha95-icon-error);
      }
      .issue-type.success > .icon {
        background-image: var(--ha95-icon-success);
      }
      .main-content {
        margin-inline: 12px 8px !important;
      }
    "ha-more-info-info $$ ha-control-slider $": |
      /* Regler (ha-control-slider) als Win95-Fortschrittsbalken: weißes,
         eingelassenes Feld, Blöcke in der Markierungsfarbe, kein Griff */
      :host {
        --control-slider-border-radius: 0px;
        --control-slider-background: transparent;
        --control-slider-background-opacity: 0;
      }
      .container {
        box-sizing: border-box;
        padding: 2px;
        background: var(--ha95-window);
        box-shadow: var(--ha95-sunken);
      }
      .slider {
        border-radius: 0 !important;
      }
      .slider .slider-track-background,
      ::slotted([slot="background"]) {
        display: none !important;
      }
      .slider:focus-visible {
        box-shadow: none !important;
        outline: 1px dotted var(--ha95-text);
        outline-offset: 1px;
      }
      .slider .slider-track-bar {
        background-color: var(--ha95-select) !important;
        border-radius: 0 !important;
      }
      .slider .slider-track-bar::after {
        display: none !important;
      }
      /* Lücken zwischen den Blöcken */
      .slider::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(90deg, transparent 0 8px, var(--ha95-window) 8px 10px);
      }
      :host([vertical]) .slider::after {
        background: repeating-linear-gradient(0deg, transparent 0 8px, var(--ha95-window) 8px 10px);
      }
      /* Wert beim Ziehen als gelbe Win95-QuickInfo */
      .tooltip {
        border-radius: 0 !important;
        background: #ffffe1 !important;
        color: #000 !important;
        box-shadow: inset 0 0 0 1px #000 !important;
        font-family: var(--ha95-font);
        font-size: 12px !important;
        padding: 1px 4px !important;
      }
    "ha-more-info-info $$ ha-control-circular-slider $": |
      /* Win95-Ring: eckige Enden, volle Farbe, eckiger Griff */
      .background,
      .arc,
      .current {
        stroke-linecap: butt !important;
      }
      .arc-colored {
        opacity: 1 !important;
      }
      .current {
        opacity: 1 !important;
        stroke: var(--ha95-text) !important;
      }
      .target-border {
        stroke-linecap: square !important;
        stroke: var(--ha95-dark) !important;
        stroke-width: 22px !important;
      }
      .target {
        stroke-linecap: square !important;
        stroke: var(--ha95-face) !important;
        stroke-width: 16px !important;
      }
      /* Ring in Blöcken wie ein Win95-Fortschrittsbalken */
      #slider {
        -webkit-mask: repeating-conic-gradient(from 0deg at 50% 50%, #000 0 4deg, transparent 4deg 5deg);
        mask: repeating-conic-gradient(from 0deg at 50% 50%, #000 0 4deg, transparent 4deg 5deg);
      }
    "ha-more-info-info $$ ha-outlined-icon-button $": |
      ha-button::part(base) {
        border: none !important;
        border-radius: 0 !important;
        background: var(--ha95-face) !important;
        box-shadow: var(--ha95-raised) !important;
        color: var(--ha95-text) !important;
      }
      ha-button:active::part(base) {
        box-shadow: var(--ha95-sunken) !important;
      }
      /* HA 2026.10: Material-Knopf statt ha-button */
      .icon-button {
        border-radius: 0 !important;
        background: var(--ha95-face) !important;
        box-shadow: var(--ha95-raised) !important;
        color: var(--ha95-text) !important;
      }
      .icon-button:active {
        box-shadow: var(--ha95-sunken) !important;
      }
      .outline,
