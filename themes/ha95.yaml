      }
      ha-button,
      ha-button::part(base) {
        width: 24px !important;
        height: 22px !important;
        min-height: 0 !important;
        padding: 0 !important;
        border-radius: 0 !important;
      }

  # Detail-Dialoge (more-info) als Win95-Fenster: Titelleiste mit
  # "Name - Bereich" und ×-Knopf rechts, darunter eine Symbolleiste mit den
  # Knöpfen (Verlauf, Einstellungen, ⋮). card-mod: nur die 3D-Knöpfe.
  card-mod-more-info: |
    /* Knöpfe als eckige 3D-Knöpfe (24×22) */
    ha-icon-button[slot=headerNavigationIcon],
    ha-icon-button[slot=headerActionItems],
    ha-dropdown[slot=headerActionItems] > ha-icon-button {
      --ha-icon-button-size: 22px;
      --mdc-icon-size: 16px;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      width: 24px !important;
      height: 22px !important;
      color: var(--ha95-text) !important;
      background: var(--ha95-face);
      box-shadow: var(--ha95-raised);
    }
    ha-icon-button[slot^=header]:active,
    ha-dropdown[slot=headerActionItems] > ha-icon-button:active {
      box-shadow: var(--ha95-sunken);
    }
    ha-dropdown[slot=headerActionItems] {
      display: inline-flex;
    }
  uix-more-info-yaml: |
    .: |
      /* Knöpfe als eckige 3D-Knöpfe (24×22) */
      ha-icon-button[slot=headerNavigationIcon],
      ha-icon-button[slot=headerActionItems],
      ha-dropdown[slot=headerActionItems] > ha-icon-button {
        --ha-icon-button-size: 22px;
        --mdc-icon-size: 16px;
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        width: 24px !important;
        height: 22px !important;
        color: var(--ha95-text) !important;
        background: var(--ha95-face);
        box-shadow: var(--ha95-raised);
      }
      ha-icon-button[slot^=header]:active,
      ha-dropdown[slot=headerActionItems] > ha-icon-button:active {
        box-shadow: var(--ha95-sunken);
      }
      ha-dropdown[slot=headerActionItems] {
        display: inline-flex;
      }
      /* ×-Knopf klein wie in der Win95-Titelleiste (16×14) */
      ha-icon-button[slot=headerNavigationIcon] {
        --ha-icon-button-size: 14px;
        --mdc-icon-size: 12px;
        width: 16px !important;
        height: 14px !important;
      }
      /* Titel einzeilig: "Name - Bereich" */
      .title {
        display: flex !important;
        flex-direction: row-reverse !important;
        justify-content: flex-end !important;
        align-items: baseline !important;
        color: var(--ha95-title-text) !important;
      }
      .title .main,
      .title .breadcrumb {
        flex: none !important;
        width: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        font-size: 13px !important;
        font-weight: bold !important;
        line-height: 18px !important;
        color: var(--ha95-title-text) !important;
        opacity: 1 !important;
      }
      .title .breadcrumb::before {
        content: " - ";
        white-space: pre;
      }
    "$ ha-dialog $ ha-dialog-header $": |
      .header {
        padding: 3px 3px 0 !important;
      }
      .header-bar {
        flex-wrap: wrap !important;
        padding: 0 !important;
      }
      /* Zeile 1: Titelleiste */
      .header-content {
        order: 1 !important;
        flex: 1 1 0 !important;
        box-sizing: border-box !important;
        height: 22px !important;
        min-height: 0 !important;
        padding: 2px 4px !important;
        justify-content: center !important;
        background: var(--ha95-title-bar) !important;
      }
      .header-title {
        height: 18px !important;
        overflow: hidden !important;
        color: var(--ha95-title-text) !important;
      }
      .header-navigation-icon {
        order: 2 !important;
        align-items: center !important;
        height: 22px !important;
        min-width: 0 !important;
        padding-inline-end: 2px !important;
        background: var(--ha95-title-bar) !important;
      }
      /* Zeile 2: Symbolleiste mit Trennlinie */
      .header-action-items {
        order: 3 !important;
        flex: 1 1 100% !important;
        height: auto !important;
        gap: 2px !important;
        padding: 4px 2px !important;
        margin-top: 2px !important;
        box-shadow: inset 0 -1px var(--ha95-highlight), inset 0 -2px var(--ha95-shadow) !important;
      }
    "ha-icon-button $": |
      /* kein runder Hover-Kreis, eckige Fläche in Knopfgröße */
      ha-button::after {
        display: none !important;
      }
      ha-button,
      ha-button::part(base) {
        width: 100% !important;
        height: 100% !important;
        min-height: 0 !important;
        padding: 0 !important;
        border-radius: 0 !important;
      }
    "ha-dropdown ha-icon-button $": |
      /* kein runder Hover-Kreis, eckige Fläche in Knopfgröße */
      ha-button::after {
        display: none !important;
      }
      ha-button,
      ha-button::part(base) {
        width: 100% !important;
        height: 100% !important;
        min-height: 0 !important;
        padding: 0 !important;
        border-radius: 0 !important;
      }

  # Seitenleiste als erhabenes Startmenü
  card-mod-sidebar: |
    :host {
      border-right: none !important;
      box-shadow: var(--ha95-raised);
    }
    .title {
      font-weight: bold;
    }


