      .header-bar {
        flex-wrap: wrap !important;
        padding: 0 !important;
        min-height: 0 !important;
      }
      /* Zeile 1: Titelleiste */
      .header-content {
        order: 1 !important;
        flex: 1 1 0 !important;
        box-sizing: border-box !important;
        height: 22px !important;
        min-height: 0 !important;
        padding: 2px 4px !important;
        justify-content: center !important;
        background: var(--ha95-title-bar) !important;
      }
      .header-title {
        height: 18px !important;
        overflow: hidden !important;
        color: var(--ha95-title-text) !important;
        font-size: 13px !important;
        font-weight: bold !important;
        line-height: 18px !important;
        text-align: var(--ha95-title-align, left);
      }
      .header-navigation-icon {
        order: 2 !important;
        align-items: center !important;
        height: 22px !important;
        min-width: 0 !important;
        padding-inline-end: 2px !important;
        background: var(--ha95-title-bar) !important;
      }
      /* Zeile 2: Symbolleiste mit Trennlinie. Den Abstand tragen die Knöpfe
         selbst, damit eine leere Leiste keinen Platz braucht. */
      .header-action-items {
        order: 3 !important;
        flex: 1 1 100% !important;
        height: auto !important;
        gap: 2px !important;
        padding: 0 2px !important;
        margin: 0 !important;
        box-shadow: inset 0 -1px var(--ha95-highlight), inset 0 -2px var(--ha95-shadow) !important;
      }
      .header-action-items ::slotted(*) {
        margin-block: 6px 6px !important;
      }
    "$ ha-bottom-sheet $": |
      /* Handy: Der Dialog kommt als Bottom-Sheet von unten. Den Zieh-Griff
         über die Titelleiste stellen statt darauf (sonst verdeckt er den Titel). */
      .handle-wrapper {
        position: static !important;
      }
    "ha-icon-button $": |
      /* kein runder Hover-Kreis, eckige Fläche in Knopfgröße */
      ha-button::after {
        display: none !important;
      }
      ha-button,
      ha-button::part(base) {
        width: 100% !important;
        height: 100% !important;
        min-height: 0 !important;
        padding: 0 !important;
        border-radius: 0 !important;
      }
    "ha-dropdown ha-icon-button $": |
      /* kein runder Hover-Kreis, eckige Fläche in Knopfgröße */
      ha-button::after {
        display: none !important;
      }
      ha-button,
      ha-button::part(base) {
        width: 100% !important;
        height: 100% !important;
        min-height: 0 !important;
        padding: 0 !important;
        border-radius: 0 !important;
      }

  # Alle anderen Dialoge (Rückfragen, Editoren, Einstellungen) als
  # Win95-Fenster mit OK/Abbrechen-Schaltflächen. Nur UIX (Typ "dialog",
  # hängt an ha-dialog bzw. ha-adaptive-dialog jedes Dialogs).
  uix-dialog-yaml: |
    .: |
      /* Titel, den der Dialog selbst in die Titelleiste legt */
      ha-dialog-header [slot=title] {
        margin: 0 !important;
        padding: 0 !important;
        font-family: var(--ha95-font) !important;
        font-size: 13px !important;
        font-weight: bold !important;
        line-height: 18px !important;
        letter-spacing: 0 !important;
        color: var(--ha95-title-text) !important;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* OK/Abbrechen als Win95-Schaltflächen (75×23), die Hauptaktion mit
         schwarzem Rand wie die Standard-Schaltfläche */
      ha-dialog-footer ha-button::part(base),
      ha-button[slot$=Action]::part(base) {
        min-width: 75px;
        height: 23px;
        min-height: 0;
        padding: 0 12px;
        border: none !important;
        border-radius: 0 !important;
        background: var(--ha95-face) !important;
        color: var(--ha95-text) !important;
        box-shadow: var(--ha95-raised) !important;
        font-family: var(--ha95-font);
        font-size: 13px;
        font-weight: normal;
        transition: none;
      }
      ha-dialog-footer ha-button[slot=primaryAction]::part(base),
      ha-button[slot=primaryAction]::part(base) {
        box-shadow: inset 0 0 0 1px var(--ha95-dark), inset -2px -2px var(--ha95-dark), inset 2px 2px var(--ha95-highlight), inset -3px -3px var(--ha95-shadow), inset 3px 3px var(--ha95-light) !important;
      }
      ha-dialog-footer ha-button:active::part(base),
      ha-button[slot$=Action]:active::part(base) {
        box-shadow: inset 0 0 0 1px var(--ha95-dark), inset 0 0 0 2px var(--ha95-shadow) !important;
        padding: 2px 11px 0 13px;
      }
      ha-dialog-footer ha-button::part(base):focus-visible,
      ha-button[slot$=Action]::part(base):focus-visible {
        outline: 1px dotted var(--ha95-text) !important;
        outline-offset: -5px !important;
      }
      ha-dialog-footer ha-button[disabled]::part(base),
      ha-button[slot$=Action][disabled]::part(base) {
        color: var(--ha95-disabled) !important;
        text-shadow: 1px 1px var(--ha95-highlight);
      }
      /* Schnellsuche als Win95-Dialog "Ausführen": Titelleiste */
      ha-adaptive-dialog.type-quick-bar ha-picker-combo-box::before {
        content: "Run";
        display: block;
        margin: 3px 3px 0;
        padding: 2px 4px;
        height: 18px;
        background: var(--ha95-title-bar);
        color: var(--ha95-title-text);
        font-family: var(--ha95-font);
        font-size: 13px;
        font-weight: bold;
        line-height: 18px;
        text-align: var(--ha95-title-align, left);
      }
      ha-adaptive-dialog.type-quick-bar ha-picker-combo-box:lang(de)::before {
        content: "Ausführen";
      }
    "&.type-quick-bar ha-picker-combo-box $": |
      /* Erklärung mit Programm-Symbol wie im Win95-Dialog "Ausführen" */
      ha-input-search {
        display: block;
        position: relative;
        margin: 0 !important;
        padding: 56px 12px 0 !important;
        background: var(--ha95-icon-run) 12px 12px / 32px no-repeat;
      }
      ha-input-search::before {
        content: "Type the name of a dashboard, device, entity or command, and Home Assistant will open it for you.";
        position: absolute;
        left: 56px;
        right: 12px;
        top: 12px;
        font-size: 13px;
        line-height: 18px;
        color: var(--ha95-text);
      }
      ha-input-search:lang(de)::before {
        content: "Geben Sie den Namen eines Dashboards, Geräts, einer Entität oder eines Befehls ein.";
      }
      /* Bereiche als Win95-Knöpfe, der gewählte eingedrückt */
      .sections {
        margin: 8px 12px 4px !important;
        padding: 0 !important;
        gap: 4px !important;
      }
      .sections .separator {
        display: none;
      }
      ha-filter-chip::part(base) {
        height: 23px;
        border: none !important;
        border-radius: 0 !important;
        background: var(--ha95-face) !important;
        color: var(--ha95-text) !important;
        box-shadow: var(--ha95-raised) !important;
        transition: none;
      }
      ha-filter-chip[selected]::part(base) {
        background: var(--ha95-light) !important;
        box-shadow: var(--ha95-sunken) !important;
      }
      /* Ergebnisliste als weißes, eingelassenes Listenfeld */
      .section-title-wrapper {
        background: var(--ha95-face) !important;
        color: var(--ha95-text-dim) !important;
      }
      .list-wrapper {
        margin: 4px 12px 12px !important;
        padding: 2px;
        background: var(--ha95-window);
        box-shadow: var(--ha95-sunken);
      }
      ha-combo-box-item {
        border-radius: 0 !important;
      }
      ha-combo-box-item[selected],
      ha-combo-box-item:hover,
      ha-combo-box-item:focus-visible {
        background: var(--ha95-select) !important;
        color: var(--ha95-select-text) !important;
        --md-list-item-label-text-color: var(--ha95-select-text);
        --md-list-item-supporting-text-color: var(--ha95-select-text);
        --md-list-item-trailing-supporting-text-color: var(--ha95-select-text);
        --mdc-icon-color: var(--ha95-select-text);
      }
    "&.type-quick-bar ha-picker-combo-box $ ha-input-search $": |
      /* Eingabefeld: weiß und eingelassen */
      wa-input::part(base) {
        background: var(--ha95-window) !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: var(--ha95-sunken) !important;
      }
