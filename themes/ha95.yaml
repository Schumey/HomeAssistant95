        padding: 8px 10px !important;
        color: var(--ha95-text);
        box-shadow: inset 1px 1px var(--ha95-shadow), inset -1px -1px var(--ha95-highlight), inset 2px 2px var(--ha95-highlight), inset -2px -2px var(--ha95-shadow);
