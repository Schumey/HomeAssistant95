        display: none !important;
      }
      md-focus-ring {
        --md-focus-ring-shape: 0px;
      }
    "$ ha-dialog $ ha-dialog-header $": |
      /* Win95-Fenster: Titelleiste oben, darunter die Symbolleiste */
