# ------------------------------------------------------------------
#  HA 95 – Home Assistant Theme-Paket
#  Version: 3.12.0
#
#  Enthält 13 Themes (wie die Farbschemata in "Eigenschaften von Anzeige"):
#    HA 95            – Standard: Teal-Desktop, Navy-Titelleisten
#    HA 98            – wie 95, aber mit Farbverlauf in den Titelleisten
#    HA 95 Rose       – Farbschema "Rose"   (Farben nachempfunden)
#    HA 95 Spruce     – Farbschema "Fichte" (Farben nachempfunden)
#    HA 95 Desert     – Farbschema "Wüste"  (Farben nachempfunden)
#    HA 95 Kontrast   – "Kontrast Schwarz"
#    HA 95 Dark       – Dunkelmodus
#    HA 95 Auto       – wechselt mit dem Hell-/Dunkelmodus (HA 95 / HA 95 Dark)
#    HA 3.11          – Windows-3.1-Look: flache Fenster, zentrierter Titel, ▼ ▲
#    HA 3.11 Hot Dog Stand / Arizona / Ozean / Schwarze Lederjacke
#                     – die Farbschemata aus Windows 3.1 (Farben nachempfunden)
#
#  Ablage:  /config/themes/ha95.yaml
#  configuration.yaml:
#    frontend:
#      themes: !include_dir_merge_named themes
#
#  Extras (optional):
#    - /config/www/ha95/ha95.css als Dashboard-Ressource -> Pixel-Schrift + Mauszeiger
#    - UIX oder card-mod (HACS) -> Fenster mit _ □ × Knöpfen, Klick-Effekt,
#      Ansichten-Tabs als Registerkarten;
#      nur UIX: Dialoge als Win95-Fenster mit OK/Abbrechen, Meldungen und
#      Hinweise mit Win95-Symbolen, Regler als Fortschrittsbalken,
#      Schnellsuche als "Ausführen", Thermostat-Knöpfe, Kontrollkästchen
#    - examples/custom-sidebar/ -> Seitenleiste als Startmenü (Custom Sidebar, HACS)
#    - /config/www/ha95/ha95-startmenu.js -> Streifen, bunte Icons, Ausklappmenüs,
#      "Ausführen …", "Es ist jetzt sicher …", Sanduhr
#
#  Diese Datei wird erzeugt: local/theme-generator/build.py aus
#  ha95.src.yaml und den CSS-Bausteinen in blocks/.
#
#  Alle Farben laufen über die ha95-* Variablen. Für ein eigenes Schema
#  reicht es, eine Variante zu kopieren und nur diese Variablen zu ändern.
# ------------------------------------------------------------------

HA 95: &ha95
  # ================= Farbschema (nur diese Werte ändern sich je Variante) =================
  ha95-desktop: "#008080"        # Desktop-Hintergrund
  ha95-face: "#c0c0c0"           # 3D-Objekte (Fenster, Karten, Knöpfe)
  ha95-highlight: "#ffffff"      # 3D-Kante hell (außen)
  ha95-light: "#dfdfdf"          # 3D-Kante hell (innen)
  ha95-shadow: "#808080"         # 3D-Kante dunkel (innen)
  ha95-dark: "#000000"           # 3D-Kante dunkel (außen)
  ha95-text: "#000000"
  ha95-text-dim: "#404040"
  ha95-disabled: "#808080"
  ha95-window: "#ffffff"         # Textfelder, Listen
  ha95-window-text: "#000000"
  ha95-title: "#000080"          # aktive Titelleiste
  ha95-title-bar: "#000080"      # Hintergrund der Kartentitel (darf ein Verlauf sein)
  ha95-title-text: "#ffffff"
  ha95-select: "#000080"         # markierte Elemente
  ha95-select-text: "#ffffff"
  ha95-active: "#808000"         # Icons im Zustand "an"
  ha95-heat: "#ff0000"           # Klima: Heizen
  ha95-cool: "#0000ff"           # Klima: Kühlen
  ha95-auto: "#008000"           # Klima: Automatik
  ha95-heat-cool: "#808000"      # Klima: Heizen/Kühlen
  ha95-dry: "#800080"            # Klima: Entfeuchten
  ha95-fan: "#008080"            # Klima: Nur Lüfter
  ha95-humid: "#008080"          # Luftbefeuchter an
  ha95-banner: "#808080"         # Streifen im Startmenü (ha95-startmenu.js)
  ha95-card: var(--ha95-face)    # Hintergrund der Karten (Fensterinhalt)

  # ================= Fensterrahmen =================
  # Rahmen von Karten und Dialogen, eingedrückt beim Klick, Rahmenbreite
  ha95-frame: var(--ha95-raised)
  ha95-frame-pressed: var(--ha95-sunken)
  ha95-frame-width: "3px"
  # Titelleiste: Knöpfe rechts, optional ein Kästchen links (Systemmenü),
  # Ausrichtung des Titels. Die Breiten müssen zu den Grafiken passen.
  ha95-title-buttons: 'url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2750%27 height=%2714%27 shape-rendering=%27crispEdges%27%3E%3Crect x=%270%27 width=%2716%27 height=%2714%27/%3E%3Crect x=%270%27 width=%2715%27 height=%2713%27 fill=%27%23fff%27/%3E%3Crect x=%271%27 y=%271%27 width=%2714%27 height=%2712%27 fill=%27%23808080%27/%3E%3Crect x=%271%27 y=%271%27 width=%2713%27 height=%2711%27 fill=%27%23c0c0c0%27/%3E%3Crect x=%274%27 y=%279%27 width=%276%27 height=%272%27/%3E%3Crect x=%2716%27 width=%2716%27 height=%2714%27/%3E%3Crect x=%2716%27 width=%2715%27 height=%2713%27 fill=%27%23fff%27/%3E%3Crect x=%2717%27 y=%271%27 width=%2714%27 height=%2712%27 fill=%27%23808080%27/%3E%3Crect x=%2717%27 y=%271%27 width=%2713%27 height=%2711%27 fill=%27%23c0c0c0%27/%3E%3Crect x=%2719%27 y=%272%27 width=%279%27 height=%279%27/%3E%3Crect x=%2720%27 y=%274%27 width=%277%27 height=%276%27 fill=%27%23c0c0c0%27/%3E%3Crect x=%2734%27 width=%2716%27 height=%2714%27/%3E%3Crect x=%2734%27 width=%2715%27 height=%2713%27 fill=%27%23fff%27/%3E%3Crect x=%2735%27 y=%271%27 width=%2714%27 height=%2712%27 fill=%27%23808080%27/%3E%3Crect x=%2735%27 y=%271%27 width=%2713%27 height=%2711%27 fill=%27%23c0c0c0%27/%3E%3Cpath d=%27M38 3l7 7M45 3l-7 7%27 stroke=%27%23000%27 stroke-width=%272%27/%3E%3C/svg%3E")'
  ha95-title-buttons-width: "50px"
  ha95-title-menu: "none"
  ha95-title-menu-width: "0px"
  ha95-title-align: "left"

  # ================= Abgeleitete Werte =================
  ha95-raised: "inset -1px -1px var(--ha95-dark), inset 1px 1px var(--ha95-highlight), inset -2px -2px var(--ha95-shadow), inset 2px 2px var(--ha95-light)"
  ha95-sunken: "inset -1px -1px var(--ha95-highlight), inset 1px 1px var(--ha95-dark), inset -2px -2px var(--ha95-light), inset 2px 2px var(--ha95-shadow)"
  ha95-font: '"Pixelated MS Sans Serif", "Microsoft Sans Serif", "MS Sans Serif", Tahoma, Geneva, Verdana, sans-serif'
  ha95-mono: '"Fixedsys", "Courier New", monospace'
  # Symbole für Hinweise und Meldungen (32×32, wie in Win95-Meldungsfenstern)
  ha95-icon-info: 'url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2732%27 height=%2732%27 shape-rendering=%27crispEdges%27%3E%3Cpath d=%27M4.5 2.5h23v19h-14l-6 6v-6h-3z%27 fill=%27%23fff%27 stroke=%27%23000%27/%3E%3Cpath d=%27M28 3v19M14 22h14M9 22v6%27 stroke=%27%23808080%27/%3E%3Crect x=%2715%27 y=%275%27 width=%273%27 height=%273%27 fill=%27%2300f%27/%3E%3Crect x=%2713%27 y=%2710%27 width=%275%27 height=%272%27 fill=%27%2300f%27/%3E%3Crect x=%2715%27 y=%2712%27 width=%273%27 height=%276%27 fill=%27%2300f%27/%3E%3Crect x=%2713%27 y=%2718%27 width=%277%27 height=%272%27 fill=%27%2300f%27/%3E%3C/svg%3E")'
  ha95-icon-warning: 'url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2732%27 height=%2732%27 shape-rendering=%27crispEdges%27%3E%3Cpath d=%27M16 2.5l13.5 26h-27z%27 fill=%27%23ff0%27 stroke=%27%23000%27/%3E%3Cpath d=%27M3 30h28M30 29l-1-2%27 stroke=%27%23808080%27/%3E%3Crect x=%2715%27 y=%2710%27 width=%273%27 height=%2711%27/%3E%3Crect x=%2715%27 y=%2723%27 width=%273%27 height=%273%27/%3E%3C/svg%3E")'
  ha95-icon-error: 'url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2732%27 height=%2732%27%3E%3Ccircle cx=%2717%27 cy=%2717%27 r=%2713%27 fill=%27%23808080%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2713%27 fill=%27%23f00%27 stroke=%27%23800000%27/%3E%3Cpath d=%27M10.5 10.5l11 11M21.5 10.5l-11 11%27 stroke=%27%23fff%27 stroke-width=%273.5%27/%3E%3C/svg%3E")'
  ha95-icon-success: 'url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2732%27 height=%2732%27%3E%3Ccircle cx=%2717%27 cy=%2717%27 r=%2713%27 fill=%27%23808080%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2713%27 fill=%27%23008000%27 stroke=%27%23004000%27/%3E%3Cpath d=%27M9.5 16.5l4.5 4.5 9-9%27 stroke=%27%23fff%27 stroke-width=%273.5%27 fill=%27none%27/%3E%3C/svg%3E")'
  ha95-icon-run: 'url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2732%27 height=%2732%27 shape-rendering=%27crispEdges%27%3E%3Crect x=%272%27 y=%274%27 width=%2728%27 height=%2722%27/%3E%3Crect x=%273%27 y=%275%27 width=%2726%27 height=%274%27 fill=%27%23000080%27/%3E%3Crect x=%273%27 y=%279%27 width=%2726%27 height=%2716%27 fill=%27%23fff%27/%3E%3Crect x=%2724%27 y=%276%27 width=%274%27 height=%272%27 fill=%27%23c0c0c0%27/%3E%3Crect x=%276%27 y=%2712%27 width=%279%27 height=%272%27 fill=%27%23808080%27/%3E%3Crect x=%276%27 y=%2716%27 width=%2714%27 height=%272%27 fill=%27%23808080%27/%3E%3Crect x=%276%27 y=%2720%27 width=%2711%27 height=%272%27 fill=%27%23808080%27/%3E%3Crect x=%274%27 y=%2726%27 width=%2727%27 height=%271%27 fill=%27%23808080%27/%3E%3Crect x=%2730%27 y=%276%27 width=%271%27 height=%2721%27 fill=%27%23808080%27/%3E%3C/svg%3E")'

  # ---------- Schrift ----------
  # UIX (ab 8.4.0) lädt die Pixel-Schrift überall, auch auf den Einstellungsseiten.
  # Ohne UIX kommt sie über die Dashboard-Ressource ha95.css (nur Dashboards).
  uix-fonts: |
    ha95-regular:
      family: Pixelated MS Sans Serif
      source: url("https://cdn.jsdelivr.net/npm/98.css@0.1.21/dist/ms_sans_serif.woff2") format("woff2")
      descriptors:
        weight: "400"
        display: swap
    ha95-bold:
      family: Pixelated MS Sans Serif
      source: url("https://cdn.jsdelivr.net/npm/98.css@0.1.21/dist/ms_sans_serif_bold.woff2") format("woff2")
      descriptors:
        weight: "700"
        display: swap
  primary-font-family: var(--ha95-font)
  paper-font-common-base_-_font-family: var(--ha95-font)
  paper-font-common-code_-_font-family: var(--ha95-mono)
  mdc-typography-font-family: var(--ha95-font)
  ha-font-family-body: var(--ha95-font)
  ha-font-family-heading: var(--ha95-font)
  ha-font-family-code: var(--ha95-mono)

  # ---------- Grundfarben ----------
  primary-color: var(--ha95-select)
  dark-primary-color: var(--ha95-title)
  light-primary-color: var(--ha95-select)
  accent-color: var(--ha95-select)
  primary-text-color: var(--ha95-text)
  secondary-text-color: var(--ha95-text-dim)
  text-primary-color: var(--ha95-select-text)
  disabled-text-color: var(--ha95-disabled)
  divider-color: var(--ha95-shadow)
  error-color: "#ff0000"
  warning-color: "#808000"
  success-color: "#008000"
  info-color: "#000080"
  mdc-theme-primary: var(--ha95-select)
  mdc-theme-secondary: var(--ha95-select)
  mdc-theme-on-primary: var(--ha95-select-text)
  # HA leitet rgb-*-Werte nur aus Hex-Farben ab -> hier explizit setzen
  rgb-primary-color: "0, 0, 128"
  rgb-accent-color: "0, 0, 128"
  rgb-primary-text-color: "0, 0, 0"
  rgb-primary-background-color: "192, 192, 192"
  rgb-card-background-color: "192, 192, 192"

  # ---------- Hintergründe ----------
  lovelace-background: var(--ha95-desktop)
  primary-background-color: var(--ha95-face)
  secondary-background-color: var(--ha95-face)
  card-background-color: var(--ha95-card)
  clear-background-color: var(--ha95-face)
  mdc-theme-surface: var(--ha95-face)
  mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.3)"

  # ---------- Karten (3D-Rahmen, keine Rundungen) ----------
  ha-card-background: var(--ha95-card)
  ha-card-border-radius: "0px"
  ha-card-border-width: "0px"
  ha-card-border-color: "transparent"
  ha-card-box-shadow: var(--ha95-frame)
  ha-card-header-color: var(--ha95-text)
  ha-card-header-font-size: "14px"

  # ---------- Eckig überall ----------
  ha-dialog-border-radius: "0px"
  ha-border-radius-2xl: "0px"
  ha-border-radius-3xl: "0px"
  ha-border-radius-4xl: "0px"
  dialog-box-shadow: var(--ha95-frame)
  dialog-backdrop-filter: "none"
  ha-dialog-surface-backdrop-filter: "none"
  mdc-shape-small: "0px"
  mdc-shape-medium: "0px"
  mdc-shape-large: "0px"
  ha-border-radius-sm: "0px"
  ha-border-radius-md: "0px"
  ha-border-radius-lg: "0px"
  ha-border-radius-xl: "0px"
  ha-border-radius-pill: "0px"
  ha-border-radius-square: "0px"
  ha-badge-border-radius: "0px"
  tile-card-border-radius: "0px"
  ha-control-border-radius: "0px"

  # ---------- Kopfzeile = Titelleiste ----------
  header-height: "36px"
  app-header-background-color: var(--ha95-title)
  app-header-text-color: var(--ha95-title-text)
  app-header-selection-bar-color: var(--ha95-title-text)
  app-header-edit-background-color: var(--ha95-shadow)

  # ---------- Seitenleiste = Startmenü ----------
  sidebar-background-color: var(--ha95-face)
  sidebar-menu-button-background-color: var(--ha95-face)
  sidebar-text-color: var(--ha95-text)
  sidebar-icon-color: var(--ha95-text)
  sidebar-selected-background-color: var(--ha95-select)
  sidebar-selected-text-color: var(--ha95-select-text)
  sidebar-selected-icon-color: var(--ha95-select-text)

  # ---------- Icons & Zustände ----------
  state-icon-color: var(--ha95-select)
  state-icon-active-color: var(--ha95-active)
  state-on-color: "#008000"
  state-off-color: var(--ha95-disabled)
  state-active-color: var(--ha95-select)
  state-inactive-color: var(--ha95-disabled)
  paper-item-icon-color: var(--ha95-select)
  paper-item-icon-active-color: var(--ha95-active)

  # ---------- Klima & Luftbefeuchter ----------
  # Färbt Ring, Icons, Kacheln und Verlauf. hvac_action (z. B. "heating")
  # nutzt automatisch die Farbe des passenden Modus.
  state-climate-heat-color: var(--ha95-heat)
  state-climate-cool-color: var(--ha95-cool)
  state-climate-auto-color: var(--ha95-auto)
  state-climate-heat-cool-color: var(--ha95-heat-cool)
  state-climate-dry-color: var(--ha95-dry)
  state-climate-fan_only-color: var(--ha95-fan)
  state-humidifier-on-color: var(--ha95-humid)

  # ---------- Schalter (ha-switch, HA 2025.10+) ----------
  # Überall: Win95-Farben. Mit UIX werden Schalter in Entitätskarten
  # zusätzlich zu echten Kontrollkästchen (siehe uix-row-yaml).
  ha-switch-background-color: var(--ha95-window)
  ha-switch-background-color-hover: var(--ha95-window)
  ha-switch-border-color: var(--ha95-shadow)
  ha-switch-thumb-background-color: var(--ha95-face)
  ha-switch-thumb-background-color-hover: var(--ha95-light)
  ha-switch-thumb-border-color: var(--ha95-dark)
  ha-switch-thumb-border-color-hover: var(--ha95-dark)
  ha-switch-checked-background-color: var(--ha95-select)
  ha-switch-checked-background-color-hover: var(--ha95-select)
  ha-switch-checked-border-color: var(--ha95-dark)
  ha-switch-checked-border-color-hover: var(--ha95-dark)
  ha-switch-checked-thumb-background-color: var(--ha95-face)
  ha-switch-checked-thumb-background-color-hover: var(--ha95-light)
  ha-switch-checked-thumb-border-color: var(--ha95-dark)
  ha-switch-checked-thumb-border-color-hover: var(--ha95-dark)
  ha-switch-thumb-box-shadow: "none"

  # ---------- Schieberegler (ha-slider) ----------
  ha-slider-track-color: var(--ha95-window)
  ha-slider-indicator-color: var(--ha95-select)
  ha-slider-thumb-color: var(--ha95-face)

  # ---------- Schalter / Slider (ältere Komponenten) ----------
  switch-checked-color: var(--ha95-select)
  switch-checked-button-color: var(--ha95-select)
  switch-checked-track-color: var(--ha95-shadow)
  switch-unchecked-color: var(--ha95-window)
  switch-unchecked-button-color: var(--ha95-window)
  switch-unchecked-track-color: var(--ha95-shadow)
  paper-slider-knob-color: var(--ha95-face)
  paper-slider-active-color: var(--ha95-select)
  paper-slider-container-color: var(--ha95-shadow)

  # ---------- Eingabefelder (wie HA95-Textboxen) ----------
  ha-color-form-background: var(--ha95-window)
  ha-color-form-background-hover: var(--ha95-window)
  ha-color-form-background-disabled: var(--ha95-face)
  input-fill-color: var(--ha95-window)
  input-ink-color: var(--ha95-window-text)
  input-label-ink-color: var(--ha95-window-text)
  input-idle-line-color: var(--ha95-shadow)
  input-hover-line-color: var(--ha95-dark)
  input-outlined-idle-border-color: var(--ha95-shadow)
  mdc-text-field-fill-color: var(--ha95-window)
  mdc-text-field-ink-color: var(--ha95-window-text)
  mdc-text-field-label-ink-color: var(--ha95-window-text)
  mdc-select-fill-color: var(--ha95-window)
  mdc-select-ink-color: var(--ha95-window-text)
  code-editor-background-color: var(--ha95-window)

  # ---------- Tabellen ----------
  data-table-background-color: var(--ha95-window)
  table-row-background-color: var(--ha95-window)
  table-row-alternative-background-color: var(--ha95-window)
  table-header-background-color: var(--ha95-face)

  # ---------- Diagramme (16-Farben-Palette) ----------
  history-unknown-color: "#808080"
  graph-color-1: "#000080"
  graph-color-2: "#800000"
  graph-color-3: "#008000"
  graph-color-4: "#808000"
  graph-color-5: "#800080"
  graph-color-6: "#008080"
  graph-color-7: "#ff0000"
  graph-color-8: "#0000ff"

  # ---------- Scrollbars ----------
  scrollbar-thumb-color: var(--ha95-face)

  # ==================================================================
  #  UIX / card-mod (optional, HACS). Ohne beides wird das ignoriert.
  #
  #  Empfohlen ist UIX (UI eXtension), der gepflegte Nachfolger von card-mod.
  #  card-mod 4.2.1 hängt sich seit HA 2026.8 komplett auf, sobald ein Design
  #  "card-mod-…-yaml"-Schlüssel enthält. Darum gibt es zwei Ebenen:
  #    card-mod-*  -> Grundlook (Fenster-Titelleisten, Klick-Effekt).
  #                   Läuft mit card-mod und mit UIX.
  #    uix-*-yaml  -> zusätzlich Thermostat-/Luftbefeuchter-Knöpfe und
  #                   Kontrollkästchen. Nur UIX liest das (mit Vorrang),
  #                   card-mod ignoriert es.
  #  Hinweis: Beide greifen in Frontend-Interna ein – nach HA-Updates prüfen.
  # ==================================================================
  card-mod-theme: HA 95

  # Grundlook für jede Karte
  card-mod-card: |
    /* eckig, auch wenn das Dashboard selbst runde Ecken setzt */
    ha-card {
      border: none !important;
      border-radius: 0 !important;
      transition: none !important;
    }
    /* nicht bei Reglern, sonst sinkt die ganze Karte beim Ziehen ein */
    :host(:not(.type-thermostat):not(.type-humidifier)) ha-card:active {
      box-shadow: var(--ha95-frame-pressed) !important;
    }
    ha-card .card-header {
      position: relative;
      background: var(--ha95-title-bar);
      color: var(--ha95-title-text) !important;
      font-weight: bold;
      font-size: 13px !important;
      line-height: 18px;
      letter-spacing: 0;
      text-align: var(--ha95-title-align, left);
      padding: 2px calc(var(--ha95-title-buttons-width, 50px) + 10px) 2px calc(var(--ha95-title-menu-width, 0px) + 4px) !important;
      margin: var(--ha95-frame-width, 3px) var(--ha95-frame-width, 3px) 8px;
    }
    ha-card .card-header .name {
      flex: 1 1 auto;
      text-align: inherit;
      color: var(--ha95-title-text) !important;
    }
    /* Systemmenü-Kästchen links (nur Win-3.1-Look) */
    ha-card .card-header::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 50%;
      transform: translateY(-50%);
      width: var(--ha95-title-menu-width, 0px);
      height: 14px;
      background: var(--ha95-title-menu, none) no-repeat;
    }
    ha-card .card-header::after {
      content: "";
      position: absolute;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);
      width: var(--ha95-title-buttons-width, 50px);
      height: 14px;
      background: var(--ha95-title-buttons) no-repeat;
    }
    /* Regler-Spur dunkler (wirkt auch ohne UIX) */
    :host(.type-thermostat) ha-card,
    :host(.type-humidifier) ha-card {
      --disabled-color: var(--ha95-shadow);
    }
    /* Entitätskarte mit Sammelschalter: Schalter in eigener Zeile
       unter der Titelleiste, rechtsbündig über den Kontrollkästchen */
    ha-card .card-header:has(hui-entities-toggle) {
      flex-wrap: wrap;
      background: none;
      padding: 0 !important;
    }
    ha-card .card-header:has(hui-entities-toggle) .name {
      flex: 1 1 100%;
      box-sizing: border-box;
