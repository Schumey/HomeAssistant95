        content: "Ausführen";
      }
      /* Titelleiste ganz oben im Fenster (ohne den Innenabstand von 16 px)
         und Schließen-Knopf rechts darin (nur das X aus dem Knopfbild) */
      ha-adaptive-dialog.type-quick-bar ha-picker-combo-box {
        position: relative;
