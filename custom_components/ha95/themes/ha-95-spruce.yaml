    "ha-config-hardware-overview $": |
      /* System-Hardware wie die Leistungsanzeige des Windows-Task-Managers:
         Wert im Feld rechts, Verlauf auf schwarzem, eingesenktem Grund mit
         grünem Raster. Die Linien zeichnet ECharts auf eine Leinwand, darum
         färbt ein Filter sie um (grau → invertiert → grün). */
      ha-card .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 14px 6px;
      }
      ha-card .header .title {
        font-weight: bold;
      }
      ha-card .header .value {
        font-weight: bold;
        padding: 1px 6px;
        background: var(--ha95-window);
        color: var(--ha95-window-text);
        box-shadow: var(--ha95-sunken);
      }
      ha-card .card-content.loading-container {
        margin: 0 12px 12px;
        padding: 0;
        background: #000;
        box-shadow: var(--ha95-sunken);
      }
      ha-card .card-content.loading-container ha-chart-base {
        margin: 2px;
        filter: grayscale(1) invert(1) contrast(2.2) brightness(1.1) sepia(1) hue-rotate(65deg) saturate(6);
      }
