      }
      .arrow {
        position: absolute;
        right: 2px;
        top: 2px;
        bottom: 2px;
        width: 16px !important;
        height: auto !important;
        margin: 0 !important;
        --mdc-icon-size: 16px;
        background: var(--ha95-face);
        box-shadow: var(--ha95-raised);
        color: var(--ha95-text) !important;
      }
