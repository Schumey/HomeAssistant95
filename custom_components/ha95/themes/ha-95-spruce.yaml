  uix-assist-chip-yaml: |
    .: |
      /* Assist-Chip (z. B. "Quellen", Zeitraum im Logbuch) als Win95-Schaltfläche,
         das Zeitraumfeld als weißes, eingelassenes Feld */
      .button {
        height: 23px !important;
        border: none !important;
        border-radius: 0 !important;
        background: var(--ha95-face) !important;
        color: var(--ha95-text) !important;
        box-shadow: var(--ha95-raised) !important;
        transition: none !important;
        transform: none !important;
        font-family: var(--ha95-font);
        font-size: 13px;
        font-weight: normal;
      }
      .button:active {
        box-shadow: inset 0 0 0 1px var(--ha95-dark), inset 0 0 0 2px var(--ha95-shadow) !important;
      }
      :host(.range) .button {
        background: var(--ha95-window) !important;
        color: var(--ha95-window-text) !important;
        box-shadow: var(--ha95-sunken) !important;
      }
      /* die abgerundete Fläche unter dem Knopf (Container samt Überlagerungen) */
      :host,
      .container,
      .container::before,
      .container::after {
        border-radius: 0 !important;
      }
  uix-grid-section-yaml: |
    .: |
      /* Abschnitt einer Abschnitts-Ansicht als Win95-Fenster: die Überschrift
         (Überschriften-Karte) wird zur Titelleiste mit Knöpfen. Nur Abschnitte
         mit Überschrift: Karten mit eigenem Titel (Verläufe, Listen) sind schon
         Fenster und bekommen keinen zweiten Rahmen. */
      .container:has(> .card > hui-card > hui-heading-card) {
        background: var(--ha95-face) !important;
        box-shadow: var(--ha95-frame) !important;
        padding: var(--ha95-frame-width, 3px) 8px 8px !important;
        gap: 8px !important;
        box-sizing: border-box;
      }
      .card:has(> hui-card > hui-heading-card) {
        position: relative;
        display: flex;
        align-items: center;
        min-height: 20px;
        margin: 0 -5px;
        padding: 1px 4px;
        background: var(--ha95-title-bar);
        --ha-heading-card-title-color: var(--ha95-title-text);
        --ha-heading-card-subtitle-color: var(--ha95-title-text);
        --mdc-icon-size: 16px;
      }
      .card:has(> hui-card > hui-heading-card)::after {
        content: "";
        position: absolute;
        right: 2px;
        top: 50%;
        transform: translateY(-50%);
        width: var(--ha95-title-buttons-width, 50px);
        height: 16px;
        background: var(--ha95-title-buttons) no-repeat;
      }
      .card:has(> hui-card > hui-heading-card) hui-card {
        flex: 1;
        padding-right: calc(var(--ha95-title-buttons-width, 50px) + 6px);
      }
      /* Weitere Überschriften im selben Abschnitt (z. B. die Bereiche in der
         Beleuchtungsübersicht): keine zweite Titelleiste, sondern eine
         Gruppenbeschriftung mit Trennlinie, damit kein Fenster im Fenster entsteht */
      .card:has(> hui-card > hui-heading-card) ~ .card:has(> hui-card > hui-heading-card) {
        margin: 2px 0 0;
        padding: 0 0 3px;
        min-height: 0;
        background: none;
        box-shadow: 0 1px var(--ha95-shadow), 0 2px var(--ha95-highlight);
        --ha-heading-card-title-color: var(--ha95-text);
        --ha-heading-card-subtitle-color: var(--ha95-text);
      }
      .card:has(> hui-card > hui-heading-card) ~ .card:has(> hui-card > hui-heading-card)::after {
        display: none;
      }
      .card:has(> hui-card > hui-heading-card) ~ .card:has(> hui-card > hui-heading-card) hui-card {
        padding-right: 0;
      }
  card-mod-top-app-bar-fixed: |
    /* Kopfleiste der Einstellungsseiten als Win95-Titelleiste */
    header.top-app-bar {
      background: var(--ha95-title-bar) !important;
      color: var(--ha95-title-text) !important;
      box-shadow: inset 0 -2px var(--ha95-face), inset 0 -3px var(--ha95-shadow) !important;
    }
    .row {
      height: var(--header-height, 36px) !important;
      padding-inline: 4px 6px !important;
    }
    .title {
      font-weight: bold !important;
      font-size: 15px !important;
      padding-inline-start: 6px !important;
      color: var(--ha95-title-text) !important;
    }
    /* Knöpfe gleich groß wie im Dashboard (24×22) */
    ha-menu-button,
    ::slotted(ha-icon-button),
    ::slotted(ha-dropdown) {
      --ha-icon-button-size: 22px;
      --mdc-icon-size: 16px;
      /* der Rahmen sitzt am Knopf selbst, nicht noch einmal am inneren ha-button */
      --ha-button-box-shadow: none;
      color: var(--ha95-text) !important;
    }
    ::slotted(ha-icon-button),
    ::slotted(ha-dropdown) {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px !important;
      height: 22px !important;
    }
    ha-menu-button,
    ::slotted(ha-icon-button),
    ::slotted(ha-dropdown) {
      background: var(--ha95-face);
      box-shadow: var(--ha95-raised);
      margin-inline-start: 2px;
    }
    /* Seiten mit Reiterzeile (z. B. Werkzeuge): Titelleiste oben, darunter eine
       graue Zeile für die Reiter-Karten */
    header.top-app-bar.has-sub-row {
      background: var(--ha95-face) !important;
      box-shadow: none !important;
    }
    header.top-app-bar.has-sub-row .row {
      background: var(--ha95-title-bar);
    }
    .sub-row {
      padding: 6px 4px 0;
      box-shadow: inset 0 -1px var(--ha95-highlight);
    }
    /* Wie die Reiterseiten der Einstellungen: schmale Titelleiste mit Fensterknöpfen,
       darunter die Zeile mit Zurück-Pfeil, Reitern und Menü */
    header.top-app-bar.has-sub-row {
      position: relative;
    }
    header.top-app-bar.has-sub-row .row {
      box-sizing: border-box;
      height: 24px !important;
      padding: 3px 3px 0 !important;
      background: none !important;
    }
    header.top-app-bar.has-sub-row .section#navigation {
      box-sizing: border-box;
      flex: 1;
      height: 18px;
      padding: 0 60px 0 4px;
      background: var(--ha95-title-bar);
    }
    header.top-app-bar.has-sub-row .section#actions {
      width: 0;
      padding: 0 !important;
      overflow: visible;
    }
    header.top-app-bar.has-sub-row .title {
      padding-inline-start: 0 !important;
      font-family: var(--ha95-font);
      font-size: 13px !important;
      line-height: 18px;
    }
    header.top-app-bar.has-sub-row .row::after {
      content: "";
      position: absolute;
      top: 4px;
      right: 5px;
      width: var(--ha95-title-buttons-width, 50px);
      height: 16px;
      background: var(--ha95-title-buttons) no-repeat;
    }
    header.top-app-bar.has-sub-row .sub-row {
      padding: 6px 40px 0 36px !important;
    }
    header.top-app-bar.has-sub-row ::slotted([slot="navigationIcon"]),
    header.top-app-bar.has-sub-row ::slotted(ha-dropdown) {
      position: absolute !important;
      top: 31px;
      margin: 0 !important;
    }
    header.top-app-bar.has-sub-row ::slotted([slot="navigationIcon"]) {
      left: 6px;
    }
    header.top-app-bar.has-sub-row ::slotted(ha-dropdown) {
      right: 6px;
    }
