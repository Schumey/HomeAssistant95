    "$ ha-bottom-sheet $": |
      /* Handy: Der Dialog kommt als Bottom-Sheet von unten. Den Zieh-Griff
         über die Titelleiste stellen statt darauf (sonst verdeckt er den Titel). */
      .handle-wrapper {
        position: static !important;
      }
    "ha-alert $": |
      /* Hinweise (ha-alert) mit eingeritztem Win95-Rahmen und den
         Symbolen aus den Win95-Meldungsfenstern */
      .issue-type {
        padding: 8px 10px !important;
        color: var(--ha95-text);
        box-shadow: inset 1px 1px var(--ha95-shadow), inset -1px -1px var(--ha95-highlight), inset 2px 2px var(--ha95-highlight), inset -2px -2px var(--ha95-shadow);
      }
      .issue-type::after {
        display: none !important;
      }
      .icon {
        width: 32px !important;
        height: 32px !important;
        flex: none;
        background: var(--ha95-icon-info) center / 32px no-repeat;
      }
      .icon ::slotted(*),
      .icon > slot > * {
        visibility: hidden !important;
      }
      .issue-type.warning > .icon {
        background-image: var(--ha95-icon-warning);
      }
      .issue-type.error > .icon {
        background-image: var(--ha95-icon-error);
      }
      .issue-type.success > .icon {
        background-image: var(--ha95-icon-success);
      }
      .main-content {
        margin-inline: 12px 8px !important;
      }
  uix-toast-yaml: |
    .: |
      /* Knopf in der Meldung als Win95-Schaltfläche */
      ha-toast ha-button::part(base) {
        min-width: 75px;
        height: 23px;
        min-height: 0;
        padding: 0 12px;
        border: none !important;
        border-radius: 0 !important;
        background: var(--ha95-face) !important;
        color: var(--ha95-text) !important;
        box-shadow: var(--ha95-raised) !important;
        font-family: var(--ha95-font);
        font-size: 13px;
        font-weight: normal;
      }
      ha-toast ha-button:active::part(base) {
        box-shadow: var(--ha95-sunken) !important;
      }
      ha-toast ha-icon-button {
        color: var(--ha95-text) !important;
      }
    $: |
      /* Meldung unten als graues Win95-Fenster mit Info-Symbol */
      .toast {
        min-height: 0 !important;
        padding: 10px 10px 10px 54px !important;
        border-radius: 0 !important;
        background: var(--ha95-icon-info) 12px center / 32px no-repeat, var(--ha95-face) !important;
        color: var(--ha95-text) !important;
        box-shadow: var(--ha95-raised), 2px 2px 0 rgba(0, 0, 0, 0.35) !important;
        font-family: var(--ha95-font);
      }
      .actions {
        color: var(--ha95-text) !important;
      }
  card-mod-sidebar: |
    :host {
      border-right: none !important;
      box-shadow: var(--ha95-raised);
    }
    .title {
      font-weight: bold;
    }
    /* Pixel-Schrift auch in den Einträgen (HA setzt dort fest Roboto) */
    .item-text,
    .badge,
    .initials,
    .ha95-sb-arrow,
    .title {
      font-family: var(--ha95-font) !important;
    }
    .item-text {
      font-size: 13px !important;
      font-weight: normal !important;
    }
    /* Zähler (z. B. Benachrichtigungen): die Pixel-Ziffer sitzt im Kasten
       einen halben Pixel zu hoch und links, daher ungleiche Innenabstände */
    .badge[slot=end] {
      padding: 2px 6px 1px 7px !important;
    }
    /* ... und im Untertext der Einträge (z. B. Temperaturen bei Heizung) */
    ha-list-item-button {
      --md-list-item-supporting-text-font: var(--ha95-font);
      --md-list-item-supporting-text-size: 11px;
      --md-list-item-label-text-font: var(--ha95-font);
      --md-list-item-trailing-supporting-text-font: var(--ha95-font);
    }
