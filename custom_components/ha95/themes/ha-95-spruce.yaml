    "ha-select $ ha-picker-field $": |
      /* Auswahlfeld wie eine Win95-Combobox: Beschriftung links,
         weißes eingelassenes Feld in der rechten Hälfte, ▼-Knopf am Rand */
      ha-combo-box-item {
        background: transparent !important;
        isolation: isolate;
        --md-list-item-one-line-container-height: 25px !important;
        --md-list-item-two-line-container-height: 25px !important;
        --md-list-item-top-space: 0px !important;
        --md-list-item-bottom-space: 0px !important;
        --md-list-item-leading-space: calc(50% + 4px) !important;
        --md-list-item-trailing-space: 20px !important;
      }
      ha-combo-box-item::before {
        content: attr(data-aria-label);
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 50%;
        box-sizing: border-box;
        padding-inline-start: 16px;
        display: flex;
        align-items: center;
        color: var(--ha95-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      ha-combo-box-item::after,
      ha-combo-box-item:focus::after {
        content: "" !important;
        display: block !important;
        position: absolute !important;
        z-index: -1;
        left: 50% !important;
        right: 0 !important;
        top: 0 !important;
        bottom: 0 !important;
        width: auto !important;
        height: auto !important;
        background: var(--ha95-window) !important;
        box-shadow: var(--ha95-sunken);
      }
