      ha-button::after {
        display: none !important;
      }
      ha-button,
      ha-button::part(base) {
        width: 100% !important;
        height: 100% !important;
        min-height: 0 !important;
        padding: 0 !important;
        border-radius: 0 !important;
      }
    "ha-automation-editor $$ ha-automation-row $": |
      /* Auslöser, Bedingungen, Aktionen: der Aufklapp-Knopf als kleiner
         3D-Knopf (16×16) neben dem Symbol statt eines 28-px-Kastens, der es
         überdeckt */
      .expand-button {
        --ha-icon-button-size: 16px;
        --mdc-icon-size: 12px;
        --ha-button-box-shadow: none;
        width: 16px !important;
        height: 16px !important;
        margin: 16px 12px 0 0 !important;
        flex: none;
        align-self: flex-start;
        display: block;
        background: var(--ha95-face);
        box-shadow: var(--ha95-raised);
        color: var(--ha95-text) !important;
      }
      /* Ziehgriff und ⋮-Menü senkrecht mittig statt oben */
      .icons {
        align-self: center !important;
        margin-inline-end: 6px !important;
      }
    "ha-automation-editor $$ ha-automation-row-targets $": |
      /* Entitäts-Chips als eingedrücktes Feld */
      .target {
        height: 26px !important;
        padding: 0 6px 0 4px !important;
        border: none !important;
        border-radius: 0 !important;
        background: var(--ha95-window) !important;
        box-shadow: var(--ha95-sunken) !important;
        color: var(--ha95-text) !important;
      }
    "ha-config-dashboard $$ ha-config-navigation-list $": |
      /* Einstellungs-Icons als eckige 3D-Kacheln (Systemsteuerung) */
      .icon-background {
        border-radius: 0 !important;
        width: 32px !important;
        height: 32px !important;
        margin-inline: 4px;
        box-shadow:
          inset -1px -1px rgba(0, 0, 0, 0.6),
          inset 1px 1px rgba(255, 255, 255, 0.6),
          inset -2px -2px rgba(0, 0, 0, 0.25),
          inset 2px 2px rgba(255, 255, 255, 0.25),
          1px 1px 0 var(--ha95-dark);
