    "ha-state-control-climate-temperature $ ha-outlined-icon-button $": |
      ha-button::part(base) {
        border: none !important;
        border-radius: 0 !important;
        background: var(--ha95-face) !important;
        box-shadow: var(--ha95-raised) !important;
        color: var(--ha95-text) !important;
      }
      ha-button:active::part(base) {
        box-shadow: var(--ha95-sunken) !important;
      }
      /* HA 2026.10: Material-Knopf statt ha-button */
      .icon-button {
        border-radius: 0 !important;
        background: var(--ha95-face) !important;
        box-shadow: var(--ha95-raised) !important;
        color: var(--ha95-text) !important;
      }
      .icon-button:active {
        box-shadow: var(--ha95-sunken) !important;
      }
      .outline,
      md-ripple {
        display: none !important;
      }
      md-focus-ring {
        --md-focus-ring-shape: 0px;
      }
    "hui-card-features $$ ha-control-slider $": |
      /* Regler (ha-control-slider) als Win95-Fortschrittsbalken: weißes,
         eingelassenes Feld, Blöcke in der Markierungsfarbe, kein Griff */
      :host {
        --control-slider-border-radius: 0px;
        --control-slider-background: transparent;
        --control-slider-background-opacity: 0;
      }
      .container {
        box-sizing: border-box;
        padding: 2px;
        background: var(--ha95-window);
        box-shadow: var(--ha95-sunken);
      }
      .slider {
        border-radius: 0 !important;
      }
      .slider .slider-track-background,
      ::slotted([slot="background"]) {
        display: none !important;
      }
      .slider:focus-visible {
        box-shadow: none !important;
        outline: 1px dotted var(--ha95-text);
        outline-offset: 1px;
      }
      .slider .slider-track-bar {
        background-color: var(--ha95-select) !important;
        border-radius: 0 !important;
      }
      .slider .slider-track-bar::after {
        display: none !important;
      }
      /* Lücken zwischen den Blöcken */
      .slider::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(90deg, transparent 0 8px, var(--ha95-window) 8px 10px);
      }
      :host([vertical]) .slider::after {
        background: repeating-linear-gradient(0deg, transparent 0 8px, var(--ha95-window) 8px 10px);
      }
      /* Wert beim Ziehen als gelbe Win95-QuickInfo */
      .tooltip {
        border-radius: 0 !important;
        background: #ffffe1 !important;
        color: #000 !important;
        box-shadow: inset 0 0 0 1px #000 !important;
        font-family: var(--ha95-font);
        font-size: 12px !important;
        padding: 1px 4px !important;
      }
    "hui-card-features $$ ha-control-switch $": |
      /* Ein/Aus-Schalter als Kachel-Feature (ha-control-switch, z. B. Licht):
         erhabener Win95-Rahmen, im Zustand "an" eingedrückt. Der Griff zeigt dann
         die Farbe der Entität (Lichtfarbe), aus ist er grau und erhaben. */
      :host {
        --control-switch-border-radius: 0px;
        --control-switch-padding: 3px;
        --control-switch-background-opacity: 1;
        --control-switch-hover-background-opacity: 1;
      }
      .switch {
        border-radius: 0 !important;
        background: var(--ha95-face);
        box-shadow: var(--ha95-raised);
      }
      .switch[checked] {
        box-shadow: var(--ha95-sunken);
      }
      .switch .background {
        background: transparent !important;
        opacity: 1 !important;
      }
      .switch .button {
        border-radius: 0 !important;
        background: var(--ha95-face) !important;
        box-shadow: var(--ha95-raised);
        color: var(--ha95-text) !important;
      }
      .switch[checked] .button {
        background: var(--control-switch-on-color) !important;
        box-shadow: var(--ha95-sunken);
        color: #000 !important;
      }
      .switch:focus-visible {
        outline: 1px dotted var(--ha95-text);
        outline-offset: -5px;
      }
    "ha-control-circular-slider $": |
      /* Win95-Ring: eckige Enden, volle Farbe, eckiger Griff */
      .background,
      .arc,
      .current {
        stroke-linecap: butt !important;
      }
      .arc-colored {
        opacity: 1 !important;
      }
      .current {
