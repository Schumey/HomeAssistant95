        --control-circular-slider-background: var(--ha95-shadow);
        --control-circular-slider-background-opacity: 1;
      }
      .buttons {
        gap: 8px;
      }
    "ha-state-control-climate-temperature $ ha-control-circular-slider $": |
      /* Win95-Ring: eckige Enden, volle Farbe, eckiger Griff */
      .background,
      .arc,
      .current {
        stroke-linecap: butt !important;
      }
      .arc-colored {
        opacity: 1 !important;
      }
      .current {
        opacity: 1 !important;
        stroke: var(--ha95-text) !important;
      }
      .target-border {
        stroke-linecap: square !important;
        stroke: var(--ha95-dark) !important;
        stroke-width: 22px !important;
      }
      .target {
        stroke-linecap: square !important;
        stroke: var(--ha95-face) !important;
        stroke-width: 16px !important;
      }
      /* Ring in Blöcken wie ein Win95-Fortschrittsbalken */
