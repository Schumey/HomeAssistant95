        box-sizing: border-box;
        background: var(--ha95-title-bar);
        padding: 2px calc(var(--ha95-title-buttons-width, 50px) + 10px) 2px calc(var(--ha95-title-menu-width, 0px) + 4px);
      }
      ha-card .card-header:has(hui-entities-toggle)::before,
      ha-card .card-header:has(hui-entities-toggle)::after {
        top: 4px;
        transform: none;
      }
      ha-card .card-header hui-entities-toggle {
        flex: none;
        margin: 6px 13px 0 auto;
      }
      /* ApexCharts-Karte (custom:apexcharts-card): Titel als Titelleiste,
         Diagramm in einem eingelassenen weißen Feld, Pixel-Schrift,
         Tooltips als gelbe Win95-QuickInfo */
      ha-card #header {
        padding: 0 0 4px !important;
      }
      ha-card #header__title {
        position: relative;
        background: var(--ha95-title-bar);
        color: var(--ha95-title-text) !important;
        font-family: var(--ha95-font);
        font-weight: bold;
        font-size: 13px !important;
        line-height: 18px;
        text-align: var(--ha95-title-align, left);
        padding: 2px calc(var(--ha95-title-buttons-width, 50px) + 10px) 2px calc(var(--ha95-title-menu-width, 0px) + 4px) !important;
        margin: var(--ha95-frame-width, 3px) var(--ha95-frame-width, 3px) 4px;
      }
      ha-card #header__title::before {
        content: "";
        position: absolute;
        left: 2px;
        top: 50%;
        transform: translateY(-50%);
        width: var(--ha95-title-menu-width, 0px);
        height: 16px;
        background: var(--ha95-title-menu, none) no-repeat;
      }
      ha-card #header__title::after {
        content: "";
        position: absolute;
        right: 2px;
        top: 50%;
        transform: translateY(-50%);
        width: var(--ha95-title-buttons-width, 50px);
        height: 16px;
        background: var(--ha95-title-buttons) no-repeat;
      }
      ha-card #header__states {
        margin: 0 8px !important;
      }
      ha-card #state__value > #state {
        font-weight: bold;
      }
      ha-card #state__name,
      ha-card #last_updated {
        font-weight: normal;
        color: var(--ha95-text-dim);
      }
      /* Diagrammfläche eingelassen und weiß wie ein Listenfeld; der Abstand
         unten sitzt in .wrapper, sonst ragt das Feld in Abschnitten aus der Karte */
      ha-card .wrapper {
        box-sizing: border-box;
        padding-bottom: 8px;
      }
      ha-card #graph-wrapper {
        box-sizing: border-box;
        margin: 0 8px;
        padding: 2px;
        background: var(--ha95-window);
        box-shadow: var(--ha95-sunken);
      }
      ha-card .apexcharts-canvas text,
      ha-card .apexcharts-legend-text,
      ha-card .apexcharts-tooltip,
      ha-card .apexcharts-xaxistooltip,
      ha-card .apexcharts-yaxistooltip {
        font-family: var(--ha95-font) !important;
      }
      ha-card .apexcharts-xaxis-label,
      ha-card .apexcharts-yaxis-label,
      ha-card .apexcharts-yaxis-title-text {
        fill: var(--ha95-window-text);
      }
      ha-card .apexcharts-legend-text {
        color: var(--ha95-window-text) !important;
      }
      /* Gitter durchgezogen in Fenstergrau statt gestrichelt */
      ha-card .apexcharts-gridline,
      ha-card .apexcharts-xaxis-tick,
      ha-card .apexcharts-yaxis-tick {
        stroke: var(--ha95-face);
        stroke-dasharray: none;
      }
      ha-card .apexcharts-xaxis line,
      ha-card .apexcharts-yaxis line,
      ha-card .apexcharts-xcrosshairs,
      ha-card .apexcharts-ycrosshairs {
        stroke: var(--ha95-shadow);
      }
      /* QuickInfo: hellgelb, schwarzer Rand, eckig, kein Schatten */
      ha-card .apexcharts-tooltip,
      ha-card .apexcharts-xaxistooltip,
      ha-card .apexcharts-yaxistooltip {
        border-radius: 0 !important;
        border: 1px solid var(--ha95-dark) !important;
        box-shadow: none !important;
        background: var(--ha95-tooltip, #ffffe1) !important;
        color: var(--ha95-tooltip-text, #000) !important;
        font-size: 11px;
      }
      ha-card .apexcharts-tooltip-title {
        background: var(--ha95-tooltip, #ffffe1) !important;
        border-bottom: 1px solid var(--ha95-shadow) !important;
        font-weight: bold;
      }
      ha-card .apexcharts-xaxistooltip::before,
      ha-card .apexcharts-xaxistooltip::after,
      ha-card .apexcharts-yaxistooltip::before,
      ha-card .apexcharts-yaxistooltip::after {
        display: none;
      }
      ha-card .apexcharts-tooltip-marker,
      ha-card .apexcharts-tooltip-marker[shape]::before {
        border-radius: 0 !important;
      }
      /* Energie-Verteilungskarte: Knoten als erhabene 3D-Kästchen mit Namen darin
         in einer versenkten weißen Fläche, Linien gestrichelt und ohne Rundungen */
      :host(.type-energy-distribution) .card-content {
        background: var(--ha95-window) !important;
        box-shadow: var(--ha95-sunken);
        margin: 8px;
        padding: 12px 16px !important;
      }
      :host(.type-energy-distribution) .circle {
        border-radius: 0 !important;
        border-width: 2px !important;
        background: var(--ha95-face) !important;
        box-shadow: var(--ha95-raised);
        color: var(--ha95-text) !important;
      }
      /* Ring um die Home-Summe passt nicht in ein Kästchen */
      :host(.type-energy-distribution) .circle svg {
        display: none;
      }
      :host(.type-energy-distribution) .circle {
        padding-top: 16px !important;
        box-sizing: border-box;
      }
      /* Name oben im Kästchen */
      :host(.type-energy-distribution) .circle-container {
        position: relative;
      }
      :host(.type-energy-distribution) .circle-container .label {
        position: absolute !important;
        top: 5px;
        left: 0;
        right: 0;
        z-index: 1;
        margin: 0 !important;
        text-align: center;
        font-weight: bold;
        color: var(--ha95-text) !important;
      }
      /* Batterie: Kästchen oben, sonst rutscht es ans untere Ende der Spalte */
      :host(.type-energy-distribution) .circle-container.battery {
        justify-content: flex-start !important;
      }
      :host(.type-energy-distribution) .lines svg {
        shape-rendering: crispEdges;
      }
      /* Linien rechtwinklig statt geschwungen (Pfade wie im Frontend, nur mit
         Ecken; mit Batterie sitzen die Abzweige etwas höher) */
      :host(.type-energy-distribution) .lines path {
        stroke-width: 2px !important;
        stroke-linecap: butt !important;
        stroke-linejoin: miter !important;
      }
      :host(.type-energy-distribution) .lines path.solar {
        d: path("M53,0 V50 H103") !important;
      }
      :host(.type-energy-distribution) .lines path.return {
        d: path("M47,0 V50 H-3") !important;
      }
      :host(.type-energy-distribution) .lines:has(path.battery-house) path.solar {
        d: path("M55,0 V45 H105") !important;
      }
      :host(.type-energy-distribution) .lines:has(path.battery-house) path.return {
        d: path("M45,0 V45 H-5") !important;
      }
      :host(.type-energy-distribution) .lines path.battery-house {
        d: path("M55,100 V55 H105") !important;
      }
      :host(.type-energy-distribution) .lines path#battery-grid {
        d: path("M45,100 V55 H-5") !important;
      }
      :host(.type-energy-distribution) .card-actions {
        border-top: none !important;
      }
      /* Timeflow-Karte (custom:timeflow-card) im Kachel-Look */
      :host(.type-custom-timeflow-card) {
        font-family: var(--ha95-font) !important;
        color: var(--ha95-text) !important;
      }
      :host(.type-custom-timeflow-card) ha-card,
      :host(.type-custom-timeflow-card) ha-card[actionhandler]:hover,
      :host(.type-custom-timeflow-card) ha-card[actionhandler]:active {
        background: var(--ha95-face) !important;
        box-shadow: var(--ha95-frame) !important;
        transform: none !important;
        transition: none !important;
      }
      :host(.type-custom-timeflow-card) ha-card[actionhandler]:active {
        box-shadow: var(--ha95-frame-pressed) !important;
      }
      :host(.type-custom-timeflow-card) .card-content,
      :host(.type-custom-timeflow-card) .card-content-compact {
        padding: 8px 10px !important;
        background: none !important;
      }
      :host(.type-custom-timeflow-card) .compact-icon,
      :host(.type-custom-timeflow-card) .header-icon {
        background: var(--ha95-face) !important;
        border-radius: 0 !important;
      }
      :host(.type-custom-timeflow-card) .compact-title,
      :host(.type-custom-timeflow-card) .title {
        font-family: var(--ha95-font) !important;
        font-weight: normal !important;
        font-size: inherit !important;
        letter-spacing: 0 !important;
        opacity: 1 !important;
        color: var(--ha95-text) !important;
      }
      :host(.type-custom-timeflow-card) .compact-subtitle,
      :host(.type-custom-timeflow-card) .subtitle {
        font-family: var(--ha95-font) !important;
        opacity: 0.7 !important;
      }
      /* Medienkarte im Look des Media Player Classic: schwarze "Videofläche"
         mit Titel und Cover, darunter Suchleiste und graue Werkzeugleiste */
      :host(.type-media-control) ha-card {
        --ha95-mpc-bar: 82px;
        color: var(--ha95-text);
      }
      /* Videofläche: schwarz, eingelassen */
      :host(.type-media-control) .background {
        inset: 6px 6px calc(var(--ha95-mpc-bar) + 6px) 6px !important;
        height: auto !important;
        width: auto !important;
        box-shadow: var(--ha95-sunken);
        background: #000;
        overflow: hidden;
      }
      :host(.type-media-control) .background .color-block,
      :host(.type-media-control) .background .no-img {
        background-color: #000 !important;
      }
      :host(.type-media-control) .background .color-gradient {
        background-image: linear-gradient(to right, #000, transparent) !important;
      }
      /* Cover mit Abstand zum Rand der Videofläche */
      :host(.type-media-control) .background .image,
      :host(.type-media-control) .background .color-gradient {
        right: 12px !important;
      }
      :host(.type-media-control) .background .image {
        background-color: #000 !important;
      }
      :host(.type-media-control) .player {
        padding: 6px !important;
        min-height: 208px;
        color: #fff !important;
      }
      :host(.type-media-control) .top-info,
      :host(.type-media-control) .media-info {
        padding: 0 8px;
        color: #fff;
      }
      :host(.type-media-control) .top-info {
        margin-top: 4px;
      }
      :host(.type-media-control) .media-info {
        font-family: var(--ha95-font);
      }
      :host(.type-media-control) .media-info * {
        color: #fff !important;
      }
      /* Titel, Suchleiste und Werkzeugleiste untereinander */
      :host(.type-media-control) .player > div:nth-child(2) {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
      }
      :host(.type-media-control) .title-controls {
        display: contents !important;
      }
      :host(.type-media-control) .media-info {
        order: 0;
        flex: 1 1 auto;
        margin-top: 8px;
      }
      :host(.type-media-control) ha-slider {
        order: 1;
        flex: none;
        margin: 6px -6px 0;
        padding: 0 6px;
        height: 30px !important;
        --thumb-width: 11px;
        --thumb-height: 19px;
      }
      :host(.type-media-control) ha-slider::part(track) {
        height: 8px;
        border-radius: 0;
        background: var(--ha95-window);
        box-shadow: var(--ha95-sunken);
      }
      :host(.type-media-control) ha-slider::part(indicator) {
        background: transparent;
      }
      /* HA blendet den Schieber in der Medienkarte aus */
      :host(.type-media-control) ha-slider::part(thumb) {
        display: block !important;
        border: none;
        border-radius: 0;
        background: var(--ha95-face);
        box-shadow: var(--ha95-raised);
      }
      :host(.type-media-control) .controls {
        order: 2;
        flex: none;
        margin: 0 !important;
        padding: 0 0 6px !important;
        height: 40px;
        align-items: center;
        color: var(--ha95-text);
      }
      :host(.type-media-control) .controls .start,
      :host(.type-media-control) .controls .end {
        display: flex;
        gap: 2px;
      }
      :host(.type-media-control) .controls .end {
        margin-left: auto;
      }
      /* Werkzeugleisten-Knöpfe: Rahmen zeichnet schon der Knopf selbst */
      :host(.type-media-control) .controls ha-icon-button,
      :host(.type-media-control) .more-info {
        --ha-icon-button-size: 30px !important;
        --mdc-icon-button-size: 30px !important;
        --mdc-icon-size: 20px;
        width: 36px !important;
        height: 30px !important;
        color: var(--ha95-text) !important;
      }
      /* Mehr-Info-Knopf: in die Werkzeugleiste, links neben den Medienquellen-Knopf */
      :host(.type-media-control) .top-info > div:last-child {
        position: absolute;
        right: 42px;
        bottom: 21px;
        width: 36px;
        height: 30px;
        z-index: 1;
      }
    "hui-energy-period-selector $": |
      /* Datumsauswahl der Energie-Karten (Shadow-Root von hui-energy-period-selector):
         Symbolleiste mit versenktem Datumsfeld und gleich großen Knöpfen */
      .content {
        gap: 4px;
        padding: 4px;
        align-items: center;
      }
      .date-picker-icon {
        width: auto !important;
        height: auto !important;
        flex: none;
      }
      .date-range {
        flex: 1 1 auto;
        height: 26px !important;
        min-height: 0 !important;
        padding: 0 6px !important;
        margin: 0 4px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        background: var(--ha95-window);
        box-shadow: var(--ha95-sunken);
      }
      .date-range .header-title {
        height: auto !important;
        line-height: 20px;
        color: var(--ha95-text);
      }
      .date-actions,
      .overflow {
        height: auto !important;
        width: auto !important;
        display: flex;
        align-items: center;
        gap: 2px;
      }
      ha-icon-button {
        --ha-icon-button-size: 28px;
        width: 28px !important;
        height: 28px !important;
      }
      ha-button {
        height: 28px !important;
      }
    "progress-circle $": |
      /* Fortschrittsring der Timeflow-Karte in Markierungsfarbe, eckige Enden */
      .progress-bg {
        stroke: var(--ha95-window) !important;
      }
      .progress-bar {
        stroke: var(--ha95-select) !important;
        stroke-linecap: butt !important;
      }
    "ha-card $": |
      /* Titel, die ha-card selbst zeichnet (z. B. Markdown-Karte) */
      .card-header {
        position: relative;
        background: var(--ha95-title-bar);
        color: var(--ha95-title-text) !important;
        font-weight: bold !important;
        font-size: 13px !important;
        line-height: 18px !important;
        letter-spacing: 0 !important;
        text-align: var(--ha95-title-align, left);
        padding: 2px calc(var(--ha95-title-buttons-width, 50px) + 10px) 2px calc(var(--ha95-title-menu-width, 0px) + 4px) !important;
        margin: var(--ha95-frame-width, 3px) var(--ha95-frame-width, 3px) 8px !important;
      }
      /* Systemmenü-Kästchen links (nur Win-3.1-Look) */
      .card-header::before {
        content: "";
        position: absolute;
        left: 2px;
        top: 50%;
        transform: translateY(-50%);
        width: var(--ha95-title-menu-width, 0px);
        height: 16px;
        background: var(--ha95-title-menu, none) no-repeat;
      }
      .card-header::after {
        content: "";
        position: absolute;
        right: 2px;
        top: 50%;
        transform: translateY(-50%);
        width: var(--ha95-title-buttons-width, 50px);
        height: 16px;
        background: var(--ha95-title-buttons) no-repeat;
      }
    "ha-state-control-climate-temperature $": |
