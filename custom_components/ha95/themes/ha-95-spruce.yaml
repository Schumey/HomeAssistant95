      }
      ha-dropdown[slot=toolbar-icon] {
        display: inline-flex;
        margin-inline-start: 2px;
      }
      ha-dropdown[slot=toolbar-icon] ha-icon-button {
        --ha-icon-button-size: 22px;
        --mdc-icon-size: 16px;
        --ha-button-box-shadow: none;
