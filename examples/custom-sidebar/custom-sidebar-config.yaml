# ------------------------------------------------------------------
#  HomeAssistant95 – Start menu sidebar for Custom Sidebar
#  Version: 3.14.1
#
#  Requires: Custom Sidebar (HACS, https://github.com/elchininet/custom-sidebar)
#  File:     /config/www/custom-sidebar-config.yaml
#
#  Every color is a ha95-* variable, so the sidebar follows whichever
#  HA 95 color scheme is selected on the profile page.
#
#  Replace the entity IDs and item names in the "order" section with your own.
#  "item" matches the visible name of a sidebar entry (case-insensitive).
#  The ha95: icons need www/ha95/ha95-icons.js (see README, "Pixel icons").
#  Without it, use mdi: icons instead.
# ------------------------------------------------------------------

# Taskbar clock in the sidebar header. Needs the Time & Date integration
# (sensor.time). Remove the subtitle line if you don't use it.
title: Start
subtitle: '[[[ states("sensor.time") ]]]'

# ---------- Colors ----------
title_color: var(--ha95-title-text)
menu_background: var(--ha95-title-bar)
sidebar_background: var(--ha95-face)
sidebar_border_color: var(--ha95-dark)
sidebar_button_color: var(--ha95-title-text)
# no round hover circle behind the menu button
sidebar_button_background_hover_opacity: 0
text_color: var(--ha95-text)
icon_color: var(--ha95-text)
info_color: var(--ha95-text-dim)
text_color_hover: var(--ha95-select-text)
icon_color_hover: var(--ha95-select-text)
info_color_hover: var(--ha95-select-text)
item_background_hover: var(--ha95-select)
item_background_hover_opacity: 1
selection_background: var(--ha95-select)
selection_opacity: 1
text_color_selected: var(--ha95-select-text)
icon_color_selected: var(--ha95-select-text)
info_color_selected: var(--ha95-select-text)
notification_color: "#ff0000"
notification_text_color: "#ffffff"
notification_border_color: var(--ha95-dark)
divider_color: var(--ha95-shadow)
scrollbar_thumb_color: var(--ha95-shadow)

# ---------- Start menu look ----------
# 3D frame and square selection. The vertical "HomeAssistant95" banner
# and the colorful icons come from www/ha95/ha95-startmenu.js.
styles: |
  :host {
    box-shadow: var(--ha95-raised);
  }
  .title {
    font-weight: bold;
    font-size: 15px !important;
    line-height: 16px !important;
  }
  /* clock below the title, sized for the 36 px title bar */
  .title::after {
    font-size: 11px !important;
    line-height: 12px !important;
  }
  :is(ha-list-item-base, ha-list-item-button) {
    border-radius: 0 !important;
  }

# ---------- Items ----------
order:
  - item: overview
    icon: ha95:home
    order: 1
    divider: true

  # Current and target temperature below the heating dashboard
  - item: heating
    icon: ha95:thermostat
    order: 2
    info: |
      [[[
        const t = state_attr("climate.living_room", "current_temperature");
        const s = state_attr("climate.living_room", "temperature");
        return t == null ? "" : t + " °C → " + s + " °C";
      ]]]

  # Current humidity below the humidifier dashboard
  - item: plants
    icon: ha95:flower
    order: 3
    info: |
      [[[
        const h = state_attr("humidifier.humidifier", "current_humidity");
        return h == null ? "" : "Humidity " + h + " %";
      ]]]

  # Red "!" badge when the vacuum reports an error
  - item: vacuum
    icon: ha95:robot-vacuum
    order: 4
    divider: true
    notification: '[[[ is_state("vacuum.robot", "error") ? "!" : "" ]]]'

  - item: map
    icon: ha95:map
    order: 5

  # "Tools" item with a Win95 flyout menu (Start menu style).
  # Needs www/ha95/ha95-startmenu.js and /config/www/ha95-startmenu.json,
  # see the README section "Start menu with submenus".
  - new_item: true
    item: Tools
    icon: ha95:cog
    bottom: true
    attributes:
      data-ha95-menu: tools
    on_click:
      action: javascript
      code: "// opened by ha95-startmenu.js"
